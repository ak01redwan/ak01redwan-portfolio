<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Ambient Glows -->
  <circle cx="150" cy="150" r="180" fill="#10b981" opacity="0.15" filter="url(#glow)" />
  <circle cx="1050" cy="480" r="220" fill="#3b82f6" opacity="0.12" filter="url(#glow)" />

  <!-- Subtle Grid Pattern -->
  <g stroke="#334155" stroke-width="1" stroke-opacity="0.25">
    <line x1="0" y1="90" x2="1200" y2="90" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="270" x2="1200" y2="270" />
    <line x1="0" y1="360" x2="1200" y2="360" />
    <line x1="0" y1="450" x2="1200" y2="450" />
    <line x1="0" y1="540" x2="1200" y2="540" />
    <line x1="150" y1="0" x2="150" y2="630" />
    <line x1="300" y1="0" x2="300" y2="630" />
    <line x1="450" y1="0" x2="450" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="750" y1="0" x2="750" y2="630" />
    <line x1="900" y1="0" x2="900" y2="630" />
    <line x1="1050" y1="0" x2="1050" y2="630" />
  </g>

  <!-- Left Content Area -->
  <g transform="translate(100, 110)">
    <!-- Brand Badge -->
    <rect width="260" height="38" rx="19" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.3" />
    <circle cx="20" cy="19" r="5" fill="#10b981" />
    <text x="35" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#10b981" letter-spacing="1">MADBOOT NOVA • FOUNDER</text>

    <!-- Main Title -->
    <text x="0" y="110" font-family="'Space Grotesk', system-ui, sans-serif" font-size="52" font-weight="800" fill="#ffffff" letter-spacing="-1.5">
      Abdulrahman Redhwan
    </text>
    <text x="0" y="165" font-family="'Space Grotesk', system-ui, sans-serif" font-size="34" font-weight="700" fill="url(#primaryGrad)">
      Full-Stack Engineer &amp; Technical Lead
    </text>

    <!-- Value Proposition -->
    <text x="0" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" fill="#94a3b8">
      Bridging Enterprise Web Architectures (Laravel, Next.js, .NET, Nuxt)
    </text>
    <text x="0" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" fill="#94a3b8">
      with Physical Hardware Engineering &amp; CNC Automation (G-Code, Arduino).
    </text>

    <!-- Tech Badges -->
    <g transform="translate(0, 310)">
      <rect x="0" y="0" width="115" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="57" y="22" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#cbd5e1">Laravel 12</text>

      <rect x="125" y="0" width="110" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="180" y="22" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#cbd5e1">Next.js 16</text>

      <rect x="245" y="0" width="105" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="297" y="22" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#cbd5e1">Nuxt.js 4</text>

      <rect x="360" y="0" width="95" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="407" y="22" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#cbd5e1">.NET Core</text>

      <rect x="465" y="0" width="145" height="34" rx="8" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1" />
      <text x="537" y="22" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#34d399">CNC / Hardware</text>
    </g>

    <!-- Footer URL -->
    <g transform="translate(0, 390)">
      <text x="0" y="0" font-family="sans-serif" font-size="16" font-weight="600" fill="#64748b">github.com/ak01redwan • madbootnova.com</text>
    </g>
  </g>

  <!-- Right Visual Terminal Card -->
  <g transform="translate(780, 110)">
    <rect width="320" height="400" rx="20" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    <!-- Terminal Header -->
    <rect width="320" height="45" rx="20" fill="#0f172a" />
    <circle cx="25" cy="22" r="6" fill="#ef4444" />
    <circle cx="45" cy="22" r="6" fill="#f59e0b" />
    <circle cx="65" cy="22" r="6" fill="#10b981" />
    <text x="160" y="27" text-anchor="middle" font-family="monospace" font-size="12" fill="#64748b">ak01redwan.sh</text>

    <!-- Terminal Code -->
    <g transform="translate(25, 75)" font-family="monospace" font-size="13" line-height="1.6">
      <text y="0" fill="#10b981">$ whoami</text>
      <text y="24" fill="#f8fafc">Abdulrahman Redhwan</text>

      <text y="58" fill="#10b981">$ get-discipline</text>
      <text y="82" fill="#38bdf8">["Full-Stack", "Hardware Maker"]</text>

      <text y="116" fill="#10b981">$ inspect-cnc-build</text>
      <text y="140" fill="#a78bfa">GRBL / Arduino / 3-Axis CNC</text>
      <text y="164" fill="#94a3b8">&gt; G-Code Precision: 0.05mm</text>

      <text y="198" fill="#10b981">$ check-deployment-ci</text>
      <text y="222" fill="#34d399">✓ Staging: &lt;3 min (Automated)</text>
      <text y="246" fill="#34d399">✓ Production: Zero Downtime</text>

      <text y="280" fill="#64748b">// Available for leadership</text>
    </g>
  </g>
</svg>
