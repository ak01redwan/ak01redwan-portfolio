<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bgCnc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="glowLaser" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgCnc)" />
  
  <!-- Coordinate grid overlay -->
  <g stroke="#1e293b" stroke-width="1" stroke-opacity="0.6">
    <line x1="100" y1="50" x2="700" y2="50" />
    <line x1="100" y1="150" x2="700" y2="150" />
    <line x1="100" y1="250" x2="700" y2="250" />
    <line x1="100" y1="350" x2="700" y2="350" />
    <line x1="100" y1="450" x2="700" y2="450" />
    <line x1="200" y1="50" x2="200" y2="450" />
    <line x1="350" y1="50" x2="350" y2="450" />
    <line x1="500" y1="50" x2="500" y2="450" />
    <line x1="650" y1="50" x2="650" y2="450" />
  </g>

  <!-- CNC Machine Structure -->
  <!-- Base Table -->
  <rect x="140" y="320" width="520" height="80" rx="6" fill="url(#metalGrad)" stroke="#334155" stroke-width="2" />
  <rect x="160" y="330" width="480" height="20" rx="3" fill="#0f172a" stroke="#10b981" stroke-width="1" stroke-opacity="0.4" />
  
  <!-- Workpiece -->
  <rect x="260" y="270" width="280" height="50" rx="4" fill="#334155" stroke="#475569" stroke-width="2" />
  <path d="M 280 295 Q 350 275 420 295 T 520 295" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="4,4" />

  <!-- Dual Gantry Columns (Y-Axis) -->
  <rect x="180" y="100" width="40" height="230" rx="4" fill="url(#metalGrad)" stroke="#475569" stroke-width="1.5" />
  <rect x="580" y="100" width="40" height="230" rx="4" fill="url(#metalGrad)" stroke="#475569" stroke-width="1.5" />
  
  <!-- Stepper Motors -->
  <rect x="175" y="80" width="50" height="35" rx="3" fill="#1e293b" stroke="#64748b" stroke-width="1.5" />
  <rect x="575" y="80" width="50" height="35" rx="3" fill="#1e293b" stroke="#64748b" stroke-width="1.5" />
  <circle cx="200" cy="97" r="8" fill="#10b981" opacity="0.8" />
  <circle cx="600" cy="97" r="8" fill="#10b981" opacity="0.8" />

  <!-- X-Axis Cross Beam -->
  <rect x="180" y="130" width="440" height="40" rx="3" fill="url(#metalGrad)" stroke="#64748b" stroke-width="2" />
  <line x1="220" y1="150" x2="580" y2="150" stroke="#06b6d4" stroke-width="3" />

  <!-- Z-Axis Spindle Carriage -->
  <rect x="360" y="115" width="80" height="120" rx="4" fill="#0f172a" stroke="#10b981" stroke-width="2" />
  <circle cx="400" cy="140" r="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
  <!-- Spindle Motor & Tool -->
  <rect x="385" y="170" width="30" height="70" rx="3" fill="#334155" />
  <polygon points="392,240 408,240 400,265" fill="#f8fafc" />
  <!-- Cutting Spark/Focus Glow -->
  <circle cx="400" cy="265" r="12" fill="#10b981" opacity="0.6" />
  <circle cx="400" cy="265" r="4" fill="#ffffff" />

  <!-- Arduino & GRBL Controller Box -->
  <g transform="translate(60, 80)">
    <rect width="90" height="120" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
    <rect x="10" y="10" width="70" height="24" rx="4" fill="#10b981" fill-opacity="0.2" />
    <text x="45" y="26" text-anchor="middle" font-family="monospace" font-size="9" font-weight="700" fill="#10b981">GRBL v1.1</text>
    
    <!-- Microcontroller Chip -->
    <rect x="25" y="45" width="40" height="40" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <circle cx="45" cy="65" r="8" fill="#06b6d4" opacity="0.8" />
    <text x="45" y="68" text-anchor="middle" font-family="monospace" font-size="7" fill="#ffffff">ATmega</text>

    <!-- Signal indicator LEDs -->
    <circle cx="20" cy="100" r="4" fill="#22c55e" />
    <circle cx="45" cy="100" r="4" fill="#38bdf8" />
    <circle cx="70" cy="100" r="4" fill="#f59e0b" />
  </g>

  <!-- Real G-Code Overlay Display Box -->
  <g transform="translate(480, 370)">
    <rect width="280" height="100" rx="10" fill="#020617" fill-opacity="0.9" stroke="#334155" stroke-width="1" />
    <text x="15" y="24" font-family="monospace" font-size="11" font-weight="700" fill="#10b981">G-CODE TELEMETRY ACTIVE</text>
    <text x="15" y="44" font-family="monospace" font-size="11" fill="#94a3b8">G21 G90 G94 (Metric, Absolute)</text>
    <text x="15" y="62" font-family="monospace" font-size="11" fill="#38bdf8">G01 X145.20 Y88.50 Z-2.0 F600</text>
    <text x="15" y="80" font-family="monospace" font-size="11" fill="#a78bfa">M03 S12000 (Spindle CW 12k RPM)</text>
  </g>

  <!-- Title Badge -->
  <g transform="translate(60, 420)">
    <text font-family="'Space Grotesk', system-ui, sans-serif" font-size="22" font-weight="700" fill="#ffffff">CNC Machining Automation</text>
    <text y="24" font-family="system-ui, sans-serif" font-size="14" fill="#94a3b8">Hardware Build: Arduino + GRBL/Marlin + G-Code/M-Code</text>
  </g>
</svg>
