<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bgShop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="blueShop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bgShop)" />

  <rect x="60" y="40" width="680" height="420" rx="14" fill="#0b1329" stroke="#334155" stroke-width="1.5" />
  
  <!-- Window Header -->
  <rect x="60" y="40" width="680" height="40" rx="14" fill="#0f172a" />
  <circle cx="85" cy="60" r="5" fill="#ef4444" />
  <circle cx="102" cy="60" r="5" fill="#f59e0b" />
  <circle cx="119" cy="60" r="5" fill="#10b981" />
  <rect x="150" y="50" width="280" height="20" rx="6" fill="#1e293b" />
  <text x="165" y="64" font-family="sans-serif" font-size="10" fill="#94a3b8">srmedeco.com • madbootnova.com (.NET Enterprise)</text>

  <!-- Storefront Top Bar -->
  <g transform="translate(80, 100)">
    <text font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="800" fill="#ffffff">SRMEDECO &amp; MADBOOT NOVA</text>
    <text y="20" font-family="sans-serif" font-size="11" fill="#94a3b8">High-Throughput .NET Core &amp; nopCommerce Architecture</text>

    <!-- Product Grid Mockup -->
    <g transform="translate(0, 45)">
      <!-- Card 1 -->
      <rect x="0" y="0" width="190" height="200" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <rect x="15" y="15" width="160" height="90" rx="6" fill="#0f172a" />
      <circle cx="95" cy="60" r="20" fill="#3b82f6" opacity="0.6" />
      <text x="15" y="130" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff">Enterprise Equipment</text>
      <text x="15" y="150" font-family="sans-serif" font-size="11" fill="#10b981" font-weight="600">$1,450.00</text>
      <rect x="15" y="165" width="160" height="24" rx="4" fill="#10b981" />
      <text x="95" y="181" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#ffffff">Direct Checkout</text>

      <!-- Card 2 -->
      <rect x="210" y="0" width="190" height="200" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <rect x="225" y="15" width="160" height="90" rx="6" fill="#0f172a" />
      <circle cx="305" cy="60" r="20" fill="#06b6d4" opacity="0.6" />
      <text x="225" y="130" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff">Industrial Automation</text>
      <text x="225" y="150" font-family="sans-serif" font-size="11" fill="#10b981" font-weight="600">$3,200.00</text>
      <rect x="225" y="165" width="160" height="24" rx="4" fill="#3b82f6" />
      <text x="305" y="181" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#ffffff">Direct Checkout</text>

      <!-- Payment & Integration Metrics Card -->
      <rect x="420" y="0" width="220" height="200" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
      <text x="435" y="30" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700" fill="#10b981">Custom Plugins &amp; APIs</text>
      
      <g transform="translate(435, 45)" font-family="sans-serif" font-size="11" fill="#cbd5e1">
        <text y="15">✓ nopCommerce Payment Gateway</text>
        <text y="40">✓ Smartstore Shipping Logistics</text>
        <text y="65">✓ SQL Server Index Optimization</text>
        <text y="90">✓ High-Load Caching Layer</text>
        <text y="115">✓ Sub-120ms Page Response</text>
      </g>
    </g>

    <!-- Bottom Feature Line -->
    <g transform="translate(0, 270)">
      <rect x="0" y="0" width="640" height="50" rx="8" fill="#1e293b" />
      <text x="20" y="30" font-family="sans-serif" font-size="12" font-weight="600" fill="#f8fafc">Key Architectural Win: Sub-second checkout latency &amp; automated multi-currency processing.</text>
    </g>
  </g>
</svg>
